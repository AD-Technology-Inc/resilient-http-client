[project]
name = "ad-tech-inc-resilient-http"
version = "0.1.0"
description = "A production-grade, asynchronous HTTP client for Python engineered to tolerate downstream service outages, network instability, and latency spikes."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "AD. Technology Inc."}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.137.1",
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "redis>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resilient_http_client"]

